# Changes require a server restart.

storage:
  type: sqlite
  host: localhost
  port: 3306
  database: incognito
  username: incognito
  password: ''
  table-prefix: incognito_
  pool-size: 4
names:
  # Replace the real name with an alias in the profile, TAB, nametag, chat and every text sent to clients.
  enabled: true
  # Show aliases instead of real names in command suggestions and chat name completion.
  # When false, suggestions contain real names.
  tabcomplete: true
  # While incognito is active the real name stops resolving as an online player
  # (/msg, /tp, /kick, selectors, Bukkit.getPlayerExact); the alias resolves instead.
  # Offline lookups (bans, whitelist, LuckPerms) keep working with the real name.
  hide_realname: true
  # Alias pattern. {random} is replaced with random hex characters (up to 10).
  # Only letters, digits and underscores are allowed around it; the whole alias is
  # capped at 16 characters, so a longer prefix shortens the random part.
  # Changing the format gives players a new alias on their next login.
  format: 'Anon_{random}'
  mask-player-messages: false
  mask-system-messages: true

join-quit:
  # player: use the player's saved choice; show/hide: force it and block switching.
  mode: player
  # Used until the player saves a preference with /incognito messages.
  default-show: true
  # In player mode, false locks saved choices (or the default for new players).
  allow-toggle: true

coordinates:
  # Shift the whole world view (chunks, entities, F3, minimaps) by a random, fixed X/Z offset per player.
  # Enabling or disabling incognito with this on requires the player to reconnect.
  enabled: true
  # Apply the same offset to numeric command suggestions (/tp, /setblock, ...).
  # When false, suggestions show real coordinates.
  tabcomplete: true
  # Regular expressions applied to text sent to clients. Values captured by the named
  # groups (?<x>...) and (?<z>...) are shifted by the player's offset; Y is never changed.
  # Patterns are case-insensitive. A pattern without x or z groups changes nothing.
  patterns:
    - '(?<![\w.])(?<x>-?\d+(?:\.\d+)?)(?:\s*[,;]\s*|\s+)-?\d+(?:\.\d+)?(?:\s*[,;]\s*|\s+)(?<z>-?\d+(?:\.\d+)?)(?![\w.])'
    - '\bx\s*[:=]\s*(?<x>-?\d+(?:\.\d+)?)'
    - '\bz\s*[:=]\s*(?<z>-?\d+(?:\.\d+)?)'
    - '\[(?<x>-?\d+), ~, (?<z>-?\d+)\]'

placeholders:
  # Wrap every PlaceholderAPI expansion so placeholder results (%player_name%, %player_x%, ...)
  # go through the same name and coordinate filter.
  enabled: true

skin:
  # Hide the real skin from other players. The player always sees their own skin.
  enabled: true
  # Optional shared skin shown instead of the default one: signed Minecraft profile
  # texture properties (not a username or an image URL). Both values must be set together.
  value: ''
  signature: ''

# Mask player heads in packets: inventories, dropped items, equipment, placed skulls and chunk data.
# Viewers see the alias and the hidden or shared skin; the items themselves keep the real profile,
# so heads look normal again once incognito is disabled.
heads: true
books: true

# Log packet translations and pipeline details. Only for troubleshooting.
debug: false

# Messages in MiniMessage format. <name> is the alias, <player> is the real name.
# notify-* messages go only to online players with incognito.admin; an empty value disables one.
messages:
  status-enabled: '<green>Incognito: <name>'
  status-disabled: '<yellow>Incognito is disabled.'
  pending-enabled: '<yellow>Incognito will be enabled after you reconnect. Please log out and join again when it is safe to do so.'
  pending-disabled: '<yellow>Incognito will be disabled after you reconnect. Please log out and join again when it is safe to do so.'
  admin-pending-enabled: '<yellow>Incognito will be enabled for <player> after they reconnect.'
  admin-pending-disabled: '<yellow>Incognito will be disabled for <player> after they reconnect.'
  players-only: '<red>This command is only available to players.'
  reconnect-required: '<yellow>Reconnect to initialize Incognito protection.'
  unsupported: '<red>Incognito protection cannot run on this server version.'
  admin-enabled: '<green>Incognito enabled for <player>. The player must reconnect.'
  admin-disabled: '<yellow>Incognito disabled for <player>.'
  join-quit-shown: '<green>Incognito join/quit messages: shown.'
  join-quit-hidden: '<yellow>Incognito join/quit messages: hidden.'
  join-quit-locked: '<red>An administrator has locked this setting.'
  # Fallbacks in join-quit.mode: show if another listener removed the event message.
  join-message: '<yellow><name> joined the game.'
  quit-message: '<yellow><name> left the game.'
  notify-enabled: '<gold>Incognito >> <yellow>Player <player> enabled incognito, new nickname: <name>'
  notify-disabled: '<gold>Incognito >> <yellow>Player <name> disabled incognito, new nickname: <player>'
  notify-alias-changed: '<gold>Incognito >> <yellow>Player <player> rejoined in incognito, new nickname: <name>'
  notify-pending-enabled: '<gold>Incognito >> <yellow>Player <player> will enable incognito after reconnecting; a nickname will be assigned at login.'
  notify-pending-disabled: '<gold>Incognito >> <yellow>Player <name> (<player>) will disable incognito after reconnecting.'
  notify-cancelled: '<gold>Incognito >> <yellow>Player <player> canceled the pending incognito change.'
