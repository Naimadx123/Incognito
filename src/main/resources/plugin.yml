name: Incognito
version: '${version}'

main: zone.vao.incognito.Incognito
api-version: '1.21.8'
load: POSTWORLD
folia-supported: true
softdepend: [PlaceholderAPI, MiniPlaceholders]
libraries:
  - com.zaxxer:HikariCP:7.1.0
  - org.xerial:sqlite-jdbc:3.53.4.0
  - com.mysql:mysql-connector-j:26.7.0
  - org.postgresql:postgresql:42.7.13
permissions:
  incognito.use:
    default: op
  incognito.admin:
    default: op
  incognito.reveal:
    default: op
