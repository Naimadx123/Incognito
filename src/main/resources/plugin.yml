name: Incognito
version: '${version}'

main: zone.vao.incognito.Incognito
api-version: '1.21.8'
load: POSTWORLD
folia-supported: true
softdepend: [PlaceholderAPI, MiniPlaceholders, dynmap, BlueMap, squaremap, Pl3xMap]
libraries:
  - com.zaxxer:HikariCP:7.1.0
  - org.xerial:sqlite-jdbc:3.53.4.0
  - com.mysql:mysql-connector-j:26.7.0
  - org.postgresql:postgresql:42.7.13
  - redis.clients:jedis:8.0.1
permissions:
  incognito.use:
    default: op
  incognito.admin:
    description: Manage other players and receive incognito state and alias notifications.
    default: op
  incognito.reveal:
    default: op
